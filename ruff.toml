# wemake-python-styleguide's own ruff setup, see the `[tool.ruff]` sections of
# https://github.com/wemake-services/wemake-python-styleguide/blob/master/pyproject.toml
# Local changes: target-version follows CI and the VPS (3.12), and the test
# ignores point at this repo's test_*.py layout instead of tests/.
target-version = "py312"
line-length = 80
preview = true
fix = true
output-prefer-rule-codes = true

[format]
quote-style = "single"
docstring-code-format = false

[lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",
  "ISC001",
  "ISC003",
  "PLR09",
  "PLR2004",
  "PLR6301",
  "RUF067",
  "RUF105",
  "RUF106",
  "RUF201",
  "TRY003",
]
external = ["WPS"]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-import-conventions.banned-from = ["ast", "datetime"]
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[lint.per-file-ignores]
"**/test_*.py" = ["S101", "S105", "S404", "S603", "S607"]

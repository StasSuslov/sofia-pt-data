[flake8]
# wemake-python-styleguide runs alone under flake8, ruff covers the rest
# (ruff.toml). Same base as the [flake8] section of
# https://github.com/wemake-services/wemake-python-styleguide/blob/master/setup.cfg
format = wemake
show-source = true
statistics = false
doctests = true
extend-exclude =
  .venv
  .claude
  data
  frontend
select = WPS, E999
per-file-ignores =
  # Fixtures, many asserts and repeated literals in tests, as upstream:
  test_*.py: WPS202, WPS211, WPS226
